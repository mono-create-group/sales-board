<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>共同営業台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* ズーム防止：入力欄を16px以上にし、ダブルタップのズームも止める（ボードと同じ） */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky"><header>
    <h1>共同営業台帳</h1>
    <div class="who" id="who" hidden><span id="email"></span><button class="btn" id="logout" type="button">ログアウト</button></div>
  </header></div>

  <section class="login" id="login" hidden>
    <b>Googleでログインしてください</b>
    <p>mono.create.group@gmail.com（または代表のGoogleアカウント）でサインインします。データの正本は Firestore だけで、この端末には営業データを保存しません。</p>
    <button class="btn pri" id="loginBtn" type="button">Googleでログイン</button>
    <div class="err" id="loginErr"></div>
  </section>

  <main class="view" id="app" hidden>
    <nav class="nav" aria-label="画面"><button id="nvS" aria-pressed="true" type="button">営業<span class="c" id="nvC"></span></button></nav>
    <div class="sync" id="sync">読み込み中…</div>
    <div class="chips" id="salesSec" role="group" aria-label="営業の置き場所"></div>
    <div class="view" id="secVideo">
      <section class="goal" id="goal" aria-label="目標" hidden></section>
      <section id="dms" aria-label="DMを送る" hidden></section>
    </div>
    <section class="view" id="secThumb" aria-label="サムネイル営業" hidden></section>
    <section class="view" id="secRecruit" aria-label="募集の確認" hidden></section>
  </main>
</div>

<div class="back" id="back" hidden><span id="backTxt"></span><button class="n" id="backN" type="button">まだ</button><button class="y" id="backY" type="button">送った</button></div>
<div class="toast" id="toast" hidden></div>
<div class="sw" id="sw" hidden role="dialog" aria-modal="true" aria-label="スワイプ確認">
  <div class="swhd"><button class="swx" id="swX" type="button" aria-label="閉じる">×</button><b id="swTitle">スワイプ確認</b><button class="swtob" id="swEx" type="button">許可リスト</button></div>
  <div class="swprog" id="swProg"></div>
  <div class="swstage" id="swStage"></div>
  <div class="swbar" id="swBar"></div>
</div>
<div class="sw" id="rc" hidden role="dialog" aria-modal="true" aria-label="募集のスワイプ確認">
  <div class="swhd"><button class="swx" id="rcX" type="button" aria-label="閉じる">×</button><b id="rcTitle">募集の確認</b><button class="swtob" id="rcEx" type="button">採用リスト</button></div>
  <div class="swprog" id="rcProg"></div>
  <div class="swstage" id="rcStage"></div>
  <div class="swbar" id="rcBar"></div>
</div>
<div class="swzoom" id="swZoom" hidden role="dialog" aria-modal="true" aria-label="プロフィール画面の拡大"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
